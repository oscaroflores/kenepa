[project]
name = "kenepa-diagnostics-backend"
version = "0.1.0"
description = "Kenepa — local stock health diagnostics backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "pytest>=8.2.2",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "SQLAlchemy>=2.0.31",
  "uvicorn[standard]>=0.30.1"
]

[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "src",
  "src.model",
  "src.parsers",
  "src.providers"
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
